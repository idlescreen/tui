name: Standard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # This job also runs `cargo test --workspace --all-targets`. A
    # deadlocked test must fail the build, not burn a runner for the
    # 6-hour default. See runtime's
    # `apply_commands_drains_channel_until_empty` incident.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime

    - name: Install build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y cargo rustc \
          libwayland-dev libxkbcommon-dev libudev-dev \
          libdbus-1-dev pkg-config libssl-dev \
          libfontconfig1-dev libfreetype6-dev

    - name: file length cap (16-256 lines per page)
      # Org-wide rule from .github/RULES.md. Excludes runtime/.
      run: |
        over=$(find . -name '*.rs' -not -path './target/*' -not -path './runtime/*' \
            | xargs wc -l \
            | awk '$1 > 256 || $1 < 16')
        if [ -n "$over" ]; then
          echo "Files outside 16-256 line range:"
          echo "$over"
          exit 1
        fi

    - name: cargo build
      run: cargo build --workspace --all-targets

    - name: cargo test
      run: cargo test --workspace --all-targets

    - name: cargo clippy
      run: cargo clippy --workspace --all-targets -- -D warnings
    - name: cargo audit (advisories)
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf \
          https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        cargo binstall -y cargo-audit
        cargo audit

    - name: cargo fmt check
      run: cargo fmt --all -- --check
  deny:
    # Supply-chain policy. Previously this repo had no deny.toml at all, and
    # `runtime`'s CI ran `cargo deny check advisories licenses` — skipping the
    # `sources` section where unknown-registry/unknown-git are denied, i.e.
    # the typosquat control. This runs the bare form, which covers advisories,
    # licenses, bans and sources.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Checkout runtime engine (path deps)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: idlescreen/runtime
        path: runtime

    - name: Install cargo-deny
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
        cargo binstall -y cargo-deny
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: cargo deny check
      run: cargo deny check
