[package]
authors = ["idlescreen developers"]
name = "idle-tui"
version = "3.2.5"
edition = "2024"
description = "Optional TUI client for IdleScreen (idle-tui)"
license = "Apache-2.0"
repository = "https://github.com/idlescreen/tui"
readme = "README.md"
publish = false

[[bin]]
name = "idle-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
# Local path dep: CI checks out idlescreen/runtime here; local may be a symlink to ../runtime
idle-dbus = { path = "runtime/crates/idle-dbus" }
idle-runner = { path = "runtime/idle-runner" }

[package.metadata.deb]
name = "idle-tui"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "Optional live TUI controller for IdleScreen."
depends = "libc6, idle-daemon"
provides = "app-tui, idlescreen-tui, trance-tui"
replaces = "app-tui, idlescreen-tui, trance-tui"
conflicts = "app-tui (<< 2.1.0), idlescreen-tui (<< 2.1.0), trance-tui (<< 2.0.0)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/idle-tui", "usr/bin/idle-tui", "755"],
    ["assets/io.github.idlescreen.tui.desktop", "usr/share/applications/io.github.idlescreen.tui.desktop", "644"]
]

[package.metadata.generate-rpm]
name = "idle-tui"
release = "1"
arch = "x86_64"
summary = "IdleScreen live TUI (idle-tui)"
description = "Optional live TUI controller for IdleScreen."
license = "Apache-2.0"
assets = [
    { source = "target/release/idle-tui", dest = "/usr/bin/idle-tui", mode = "755" },
    { source = "assets/io.github.idlescreen.tui.desktop", dest = "/usr/share/applications/io.github.idlescreen.tui.desktop", mode = "644" }
]

[package.metadata.generate-rpm.requires]
idle-daemon = "*"

[package.metadata.generate-rpm.provides]
app-tui = "*"
idlescreen-tui = "*"
trance-tui = "*"

[package.metadata.generate-rpm.obsoletes]
app-tui = "*"
idlescreen-tui = "*"
trance-tui = "*"
